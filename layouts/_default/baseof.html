<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }} | UPM{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | plainify | truncate 160 }}{{ else }}{{ site.Params.descripcion }}{{ end }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  {{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
  {{ end }}<link rel="icon" href="{{ "img/favicon.svg" | relURL }}" type="image/svg+xml">
</head>
<body>
  <a class="saltar" href="#main">{{ i18n "saltar" }}</a>
  {{ partial "cabecera.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "pie.html" . }}
  <script src="{{ "js/main.js" | relURL }}" defer></script>
</body>
</html>
