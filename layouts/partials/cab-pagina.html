<div class="cab-pag">
  <div class="contenedor">
    <nav class="miga" aria-label="{{ i18n "miga" }}">
      {{ range .Ancestors.Reverse }}<a href="{{ .RelPermalink }}">{{ if .IsHome }}{{ i18n "inicio" }}{{ else }}{{ .Title }}{{ end }}</a> › {{ end }}<span aria-current="page">{{ .Title }}</span>
    </nav>
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitulo }}<p class="subtit">{{ . }}</p>{{ end }}
  </div>
</div>
