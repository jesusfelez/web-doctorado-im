{{ define "main" }}
{{ partial "cab-pagina.html" . }}
<div class="contenedor" style="padding-top:36px;padding-bottom:64px;max-width:860px">
  <article class="contenido">
    <p class="fecha">{{ .Date.Format "02/01/2006" }}</p>
    {{ with .Params.imagen }}<img src="{{ . | relURL }}" alt="{{ $.Params.imagen_alt | default "" }}" class="img-noticia">{{ end }}
    {{ .Content }}
    <p style="margin-top:32px"><a class="ver-todo" href="{{ "noticias/" | relURL }}">Todas las noticias</a></p>
  </article>
</div>
{{ end }}
