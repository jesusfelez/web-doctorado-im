aviso:
  mostrar: true
  titulo: "Novedad 2026:"
  texto: "la memoria del programa se ha adaptado al Real Decreto 576/2023, con informe favorable de la Fundación Madri+d (septiembre de 2026). Consulta los nuevos [perfiles de acceso](/admision/perfiles/), [actividades formativas](/doctorandos/formacion/) y [requisitos de la tesis](/tesis/requisitos/)."
accesos:
  - titulo: "Futuros doctorandos"
