# =====================================================================
#  Web del Programa de Doctorado en Ingeniería Mecánica (UPM)
#  Configuración general de Hugo
# =====================================================================
# Rutas relativas: la misma web funciona en local, en la raíz o en /doctorado/ sin cambios
baseURL = "/"
defaultContentLanguage = "es"
defaultContentLanguageInSubdir = false   # castellano en la raíz, inglés en /en/
enableRobotsTXT = true
# Enlaces relativos: la web funciona igual en local, en /doctorado/ o en otro dominio
relativeURLs = true


[markup.goldmark.renderer]
  unsafe = true   # permite HTML dentro del Markdown

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# ---------------------------------------------------------------------
#  IDIOMAS: castellano (principal) e inglés.
#  Cada página tiene dos archivos: pagina.es.md y pagina.en.md
#  Los textos fijos de las plantillas están en i18n/es.yaml e i18n/en.yaml
# ---------------------------------------------------------------------
[languages.es]
  languageName = "Español"
  languageCode = "es-es"
  title = "Programa de Doctorado en Ingeniería Mecánica"
  weight = 1
  [languages.es.params]
  descripcion = "Programa de Doctorado en Ingeniería Mecánica de la Universidad Politécnica de Madrid. ETS de Ingenieros Industriales."
  universidad = "Universidad Politécnica de Madrid"
  centro = "ETS de Ingenieros Industriales"
  departamento = "Departamento de Ingeniería Mecánica"
  direccion = "C/ José Gutiérrez Abascal, 2 · 28006 Madrid"
  email = "ingenieriamecanica.industriales@upm.es"
  codigoRUCT = "5600706"

[languages.en]
  languageName = "English"
  languageCode = "en-gb"
  title = "PhD Programme in Mechanical Engineering"
  weight = 2
  [languages.en.params]
  descripcion = "PhD Programme in Mechanical Engineering at Universidad Politécnica de Madrid (UPM). School of Industrial Engineering (ETSII)."
  universidad = "Universidad Politécnica de Madrid"
  centro = "School of Industrial Engineering (ETSII)"
  departamento = "Department of Mechanical Engineering"
  direccion = "C/ José Gutiérrez Abascal, 2 · 28006 Madrid"
  email = "ingenieriamecanica.industriales@upm.es"
  codigoRUCT = "5600706"

