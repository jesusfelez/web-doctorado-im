# =====================================================================
#  Web del Programa de Doctorado en Ingeniería Mecánica (UPM)
#  Configuración general de Hugo
# =====================================================================
# Rutas relativas: la misma web funciona en local, en la raíz o en /doctorado/ sin cambios
baseURL = "/"
languageCode = "es-es"
defaultContentLanguage = "es"
title = "Programa de Doctorado en Ingeniería Mecánica"
enableRobotsTXT = true
# Enlaces relativos: la web funciona igual en local, en /doctorado/ o en otro dominio
relativeURLs = true

[params]
  descripcion = "Programa de Doctorado en Ingeniería Mecánica de la Universidad Politécnica de Madrid. ETS de Ingenieros Industriales."
  universidad = "Universidad Politécnica de Madrid"
  centro = "ETS de Ingenieros Industriales"
  departamento = "Departamento de Ingeniería Mecánica"
  direccion = "C/ José Gutiérrez Abascal, 2 · 28006 Madrid"
  email = "secretaria@dimf.etsii.upm.es"
  codigoRUCT = ""          # código del título en el RUCT (pendiente)

[markup.goldmark.renderer]
  unsafe = true   # permite HTML dentro del Markdown

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

